<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог Дроп IT — хаб инструментов, нейросетей и скиллов</title>
<meta name="description" content="Хаб проверенных AI-инструментов, нейросетей и скиллов из канала Дроп IT. Всё разложено по категориям, обновляется живьём.">
<meta property="og:title" content="Каталог Дроп IT — хаб инструментов">
<meta property="og:description" content="Проверенные инструменты, нейросети и скиллы из канала Дроп IT. По полочкам.">
<meta property="og:image" content="assets/social-preview.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/dropit-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
  :root{
    --bg:#080c0a; --bg2:#0c120e; --card:#101913; --card-h:#152019;
    --line:#1b2a22; --line2:#243a2f;
    --green:#9fe838; --green-2:#34d178; --green-d:#1f9d57; --green-soft:rgba(159,232,56,.13);
    --txt:#eaf3ec; --muted:#90a698; --muted2:#5f7468;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Unbounded",-apple-system,BlinkMacSystemFont,sans-serif;
    --body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{overflow-x:hidden;max-width:100%}
  body{
    margin:0; color:var(--txt); font-family:var(--body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background:
      /* верхний чёрный слой держит черноту под баннером и ПЛАВНО открывает зелёный фон ниже —
         так стык чёрного баннера и зелёного фона размазан, без резкой полосы (фикс перехода) */
      linear-gradient(180deg, var(--bg) 0, var(--bg) 215px, rgba(8,12,10,0) 470px),
      radial-gradient(1100px 560px at 82% 6%, rgba(159,232,56,.10), transparent 58%),
      radial-gradient(900px 500px at 8% 12%, rgba(52,209,120,.06), transparent 60%),
      var(--bg);
  }
  /* тонкая «сетка-блюпринт» поверх фона — атмосфера тех-хаба */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(159,232,56,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(159,232,56,.025) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:1}

  /* ─── HERO ─── */
  header.top{position:relative}     /* border-bottom убран — он и давал резкую линию-полосу */
  .hero-banner{position:relative;height:230px;overflow:hidden;isolation:isolate;background:var(--bg)}
  .hero-banner::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(70% 54% at 50% -8%, rgba(159,232,56,.14), transparent 52%)}
  /* видео-фон (wallpaper) — НЕ ТРОГАТЬ режим показа: квадрат вписывается contain+lighten */
  .hero-banner .hero-bg{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;object-position:center;z-index:1;mix-blend-mode:lighten;opacity:1}
  .hero-banner::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, transparent 48%, var(--bg) 99%)}
  .hero-text{text-align:center;padding:2px 22px 30px;margin-top:-14px;position:relative;z-index:3}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--green);display:inline-flex;align-items:center;gap:9px;margin-bottom:14px}
  .kicker::before,.kicker::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--green-d))}
  .kicker::after{background:linear-gradient(90deg,var(--green-d),transparent)}
  .hero-text h1{margin:0;font-family:var(--disp);font-size:46px;line-height:1.02;letter-spacing:-1px;font-weight:800}
  .hero-text h1 .ac{color:var(--green)}
  .hero-text .sub{color:var(--muted);font-size:15.5px;margin:15px auto 0;max-width:600px}
  .chanbtn{display:inline-flex;align-items:center;gap:8px;margin-top:24px;
    background:var(--green);color:#06140a;font-weight:700;font-size:14.5px;font-family:var(--body);
    padding:11px 22px;border-radius:999px;transition:.16s transform,.16s box-shadow;
    box-shadow:0 10px 30px -8px rgba(159,232,56,.5)}
  .chanbtn:hover{transform:translateY(-2px);box-shadow:0 16px 38px -10px rgba(159,232,56,.65)}

  /* ─── СТАТ-ПОЛОСА ─── */
  .stats{display:flex;justify-content:center;gap:0;flex-wrap:wrap;margin:22px auto 4px;max-width:760px}
  .stats .st{flex:1;min-width:130px;text-align:center;padding:6px 14px;position:relative}
  .stats .st + .st::before{content:"";position:absolute;left:0;top:18%;height:64%;width:1px;background:var(--line2)}
  .stats .st b{display:block;font-family:var(--mono);font-size:27px;font-weight:700;color:var(--txt);letter-spacing:-.5px}
  .stats .st span{font-size:12.5px;color:var(--muted2);letter-spacing:.3px}

  /* ─── CONTROLS ─── */
  .controls{position:sticky;top:0;z-index:20;background:rgba(8,12,10,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:13px 0;margin-top:22px}
  .controls .wrap{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:210px;position:relative}
  .search input{width:100%;background:var(--card);border:1px solid var(--line);font-family:var(--body);
    color:var(--txt);padding:11px 14px 11px 40px;border-radius:12px;font-size:15px;outline:none;transition:.15s border}
  .search input:focus{border-color:var(--green-d)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  .sortbox{position:relative}
  .sortbox select{appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);
    color:var(--muted);font-family:var(--body);font-size:14px;padding:11px 34px 11px 14px;border-radius:12px;
    cursor:pointer;outline:none;transition:.15s}
  .sortbox select:hover{color:var(--txt);border-color:var(--green-d)}
  .sortbox::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
  .count{color:var(--muted2);font-size:13px;font-family:var(--mono);white-space:nowrap}

  /* ─── КАТЕГОРИИ-ФИЛЬТРЫ ─── */
  .cats{display:flex;gap:9px;flex-wrap:wrap;padding:20px 0 6px}
  .cats button{font-family:var(--body);font-size:13.5px;color:var(--muted);background:var(--card);
    border:1px solid var(--line);padding:7px 13px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .cats button:hover{color:var(--txt);border-color:var(--line2)}
  .cats button .c{font-family:var(--mono);font-size:11px;color:var(--muted2);
    background:var(--bg2);border-radius:999px;padding:1px 7px;transition:.15s}
  .cats button.on{color:#06140a;background:var(--green);border-color:var(--green);font-weight:600}
  .cats button.on .c{color:#06140a;background:rgba(0,0,0,.14)}

  /* ─── СЕКЦИИ / ГРИД ─── */
  section.cat{padding:24px 0 4px}
  section.cat h2{font-family:var(--disp);font-size:19px;margin:0 0 16px;font-weight:700;
    display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
  section.cat h2 .n{font-family:var(--mono);font-size:12px;color:var(--green);background:var(--green-soft);
    border-radius:999px;padding:2px 9px;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:15px}

  .tool{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:17px 18px 16px;
    display:flex;flex-direction:column;gap:10px;overflow:hidden;
    transition:.17s transform,.17s border-color,.17s box-shadow;scroll-margin-top:96px}
  .tool::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:radial-gradient(120% 80% at 0% 0%, rgba(159,232,56,.07), transparent 42%);opacity:0;transition:.17s}
  .tool:hover{transform:translateY(-3px);border-color:var(--green-d);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.7),0 0 0 1px rgba(159,232,56,.12)}
  .tool:hover::after{opacity:1}
  .tool.flash{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft),0 0 40px -6px rgba(159,232,56,.55)}
  .tool .top{display:flex;align-items:flex-start;gap:11px}
  .tool .ava{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    font-size:19px;line-height:1;
    background:linear-gradient(135deg, hsl(var(--hue,140) 60% 18%), hsl(calc(var(--hue,140) + 40) 50% 12%));
    border:1px solid hsl(var(--hue,140) 40% 28% / .5);text-transform:uppercase}
  .tool .hd{flex:1;min-width:0}
  .tool .name{font-weight:600;font-size:16.5px;letter-spacing:-.2px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool .src{font-family:var(--mono);font-size:11px;color:var(--muted2);margin-top:2px;display:block}
  .tool .badges{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .tool .me{font-size:10.5px;font-weight:600;color:var(--green);border:1px solid var(--green-d);
    border-radius:999px;padding:2px 8px;white-space:nowrap}
  .tool .new{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;color:#06120c;
    background:var(--green);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .tool .desc{color:var(--muted);font-size:14px;line-height:1.5;flex:1}
  .tool .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;
    color:var(--muted2);font-family:var(--mono)}
  .tool .meta .tag{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  .tool .meta .tag.star{color:var(--green-2)}
  .tool .acts{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .tool .go{display:inline-flex;align-items:center;gap:5px;
    color:var(--green);font-weight:600;font-size:13.5px;transition:.15s gap}
  .tool .go.dl{background:var(--green);color:#06140a;padding:6px 14px;border-radius:8px;font-size:13px;
    font-weight:700;transition:.15s transform,.15s box-shadow;
    box-shadow:0 4px 14px -4px rgba(159,232,56,.4)}
  .tool .go.dl:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(159,232,56,.6)}
  .tool .go.sec{font-size:12.5px;color:var(--muted2);font-weight:500}
  .tool .go.sec:hover{color:var(--green)}
  .tool:hover .go:not(.dl):not(.sec){gap:9px}
  .empty{color:var(--muted2);padding:54px 0;text-align:center}

  footer{border-top:1px solid var(--line);margin-top:46px;padding:34px 0 56px;color:var(--muted2);font-size:13.5px}
  footer a{color:var(--green)}
  footer .fl{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  footer .live{font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:7px}
  footer .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(159,232,56,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(159,232,56,.5)}70%{box-shadow:0 0 0 8px rgba(159,232,56,0)}100%{box-shadow:0 0 0 0 rgba(159,232,56,0)}}

  /* появление карточек */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tool{animation:rise .4s both}

  /* ─── АДАПТИВ: телефон + планшет (iPad 1024 включительно) ─── */
  @media(max-width:1024px){ .wrap{max-width:920px} .hero-text h1{font-size:40px} }
  @media(max-width:768px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .hero-banner{height:200px}
    .hero-text h1{font-size:34px}
    .stats{max-width:560px}
    /* категории: горизонтальный скролл вместо переноса */
    .cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding:16px 0 8px;gap:8px}
    .cats::-webkit-scrollbar{display:none}
    .cats button{flex-shrink:0;font-size:13px;padding:6px 12px}
  }
  @media(max-width:560px){
    .wrap{padding:0 14px}
    .grid{grid-template-columns:1fr;gap:10px}
    .hero-banner{height:150px}
    .hero-text{padding:0 12px 20px;margin-top:-8px}
    .hero-text h1{font-size:24px;letter-spacing:-.5px}
    .hero-text .sub{font-size:13px;margin-top:10px}
    .kicker{font-size:10px;letter-spacing:2px}
    .chanbtn{padding:9px 18px;font-size:13px}
    .stats .st b{font-size:21px}
    .stats .st span{font-size:11px}
    .controls .wrap{gap:8px}
    .search{min-width:100%;order:1}
    .search input{font-size:15px;padding:10px 14px 10px 38px}
    .sortbox{order:2}.count{order:3;margin-left:auto}
    /* карточки: компактнее, удобнее для пальца */
    .tool{padding:14px 14px 13px;border-radius:14px;gap:8px}
    .tool .ava{width:34px;height:34px;border-radius:8px;font-size:16px}
    .tool .name{font-size:15px}
    .tool .src{font-size:10px}
    .tool .desc{font-size:13px;line-height:1.45}
    .tool .meta{font-size:11px;gap:5px}
    .tool .meta .tag{padding:2px 6px;font-size:11px}
    .tool .acts{gap:8px;margin-top:4px}
    .tool .go{font-size:12.5px}
    .tool .go.dl{padding:5px 12px;font-size:12px;border-radius:7px}
    .tool .go.sec{font-size:11.5px}
    /* секции */
    section.cat h2{font-size:17px}
    section.cat h2 .n{font-size:11px;padding:1px 7px}
    footer{padding:24px 0 40px;font-size:12.5px}
  }
  /* совсем маленькие экраны (SE, мини) */
  @media(max-width:380px){
    .hero-text h1{font-size:21px}
    .grid{gap:8px}
    .tool{padding:12px 12px 11px}
    .tool .name{font-size:14px}
    .stats{gap:0}
    .stats .st{padding:4px 8px}
    .stats .st b{font-size:19px}
  }
  @media(prefers-reduced-motion:reduce){ .tool{animation:none} body::before{opacity:.3} }
</style>
</head>
<body>
<header class="top">
  <div class="hero-banner">
    <video class="hero-bg" autoplay loop muted playsinline preload="auto">
      <source src="assets/wallpaper.webm" type="video/webm">
      <source src="assets/wallpaper.mp4" type="video/mp4">
    </video>
  </div>
  <div class="wrap hero-text">
    <div class="kicker">Дроп IT · <span style="text-transform:none">Hub</span></div>
    <h1 id="title">Каталог <span class="ac">инструментов</span></h1>
    <div class="sub" id="subtitle"></div>
    <div class="stats" id="stats"></div>
    <a class="chanbtn" id="chan" href="https://t.me/aidrop_hq" target="_blank" rel="noopener">
      Наш канал в Telegram →
    </a>
  </div>
</header>

<div class="controls"><div class="wrap">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#90a698" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Поиск: парсинг, нейросеть, агент, скилл…" autocomplete="off">
  </div>
  <div class="sortbox">
    <select id="sort">
      <option value="default">Сначала по разделам</option>
      <option value="new">Сначала новые</option>
      <option value="stars">По популярности ★</option>
      <option value="az">По алфавиту А–Я</option>
    </select>
  </div>
  <span class="count" id="count"></span>
</div></div>

<div class="wrap">
  <nav class="cats" id="cats"></nav>
  <main id="list"></main>
  <div class="empty" id="empty" style="display:none">Ничего не нашлось — попробуй другое слово.</div>
</div>

<footer><div class="wrap"><div class="fl">
  <div>
    Собираем сюда инструменты, нейросети и скиллы из
    <a href="https://t.me/aidrop_hq" target="_blank" rel="noopener">@aidrop_hq</a>.
    Всё проверено руками. Нашёл крутое — пиши в канал.
  </div>
  <div class="live">обновляется живьём</div>
</div></div></footer>

<script>
const esc = s => (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AVA_ICON = {'github':'🔧','trending':'🔥','hugging face':'📄','hf':'📄','npm':'📦','pypi':'📦','curator':'📡','primary':'🛰','ru':'🇷🇺'};
function slugify(name){
  return (name||"").trim().toLowerCase()
    .replace(/[\s/]+/g,'-').replace(/[^a-z0-9а-яё-]/g,'')
    .replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function plural(n,a,b,c){const m=n%100,d=n%10;return m>=11&&m<=14?c:d===1?a:d>=2&&d<=4?b:c;}

let DATA={categories:[],tools:[]};
let NEW_SET=new Set();
let CUR_CAT="all";          // активная категория-фильтр
let CUR_SORT="default";
const NEW_COUNT=6;

function computeNew(tools){
  return new Set([...(tools||[])]
    .map((t,i)=>({s:(t.slug||slugify(t.name)), k:(t.added||'')+String(i).padStart(4,'0')}))
    .sort((a,b)=>a.k<b.k?-1:1)
    .slice(-NEW_COUNT).map(x=>x.s));
}
// порядковый «вес новизны» — чем позже добавлен, тем больше
function newRank(tools){
  const m=new Map();
  [...tools].map((t,i)=>({s:(t.slug||slugify(t.name)),k:(t.added||'')+String(i).padStart(4,'0')}))
    .sort((a,b)=>a.k<b.k?-1:1).forEach((x,i)=>m.set(x.s,i));
  return m;
}
let NEW_RANK=new Map();

const SRC_LABEL={github:"GitHub",site:"сайт",huggingface:"Hugging Face","app store":"App Store",
  npm:"npm",pypi:"PyPI","google play":"Google Play"};

function card(t){
  const slug = t.slug || slugify(t.name);
  const stars = t.stars ? `<span class="tag star">★ ${Number(t.stars).toLocaleString('ru')}</span>` : '';
  const lang = t.lang ? `<span class="tag">${esc(t.lang)}</span>` : '';
  const src = t.source ? (SRC_LABEL[String(t.source).toLowerCase()]||esc(t.source)) : '';
  const me = t.audience==='me' ? `<span class="me">наш инструмент</span>` : '';
  const isNew = NEW_SET.has(slug) ? `<span class="new">NEW</span>` : '';
  const ico = AVA_ICON[String(t.source||'').toLowerCase()] || '🔧';
  const hue = Math.abs([...slug].reduce((h,c)=>((h<<5)-h)+c.charCodeAt(0),0)) % 360;
  const isGH = /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/?$/.test(t.url||'');
  const dlUrl = isGH ? t.url.replace(/\/?$/,'/archive/refs/heads/main.zip') : '';
  const actions = dlUrl
    ? `<div class="acts"><a class="go dl" href="${esc(dlUrl)}" download>⬇ Скачать</a><a class="go sec" href="${esc(t.url)}" target="_blank" rel="noopener">Источник →</a></div>`
    : `<div class="acts"><a class="go" href="${esc(t.url)}" target="_blank" rel="noopener">Открыть источник →</a></div>`;
  return `<div class="tool" id="${slug}">
    <div class="top">
      <div class="ava" style="--hue:${hue}">${ico}</div>
      <div class="hd"><span class="name">${esc(t.name)}</span>${src?`<span class="src">${src}</span>`:''}</div>
      <span class="badges">${isNew}${me}</span>
    </div>
    <div class="desc">${esc(t.desc_ru||'')}</div>
    <div class="meta">${lang}${stars}</div>
    ${actions}
  </div>`;
}

function matches(t,f){ return !f || (t.name+' '+(t.desc_ru||'')+' '+(t.lang||'')+' '+(t.source||'')).toLowerCase().includes(f); }
function sortTools(arr){
  const a=[...arr];
  if(CUR_SORT==='stars') a.sort((x,y)=>(y.stars||0)-(x.stars||0));
  else if(CUR_SORT==='az') a.sort((x,y)=>x.name.localeCompare(y.name,'ru'));
  else if(CUR_SORT==='new') a.sort((x,y)=>(NEW_RANK.get(y.slug||slugify(y.name))||0)-(NEW_RANK.get(x.slug||slugify(x.name))||0));
  return a;
}

function render(){
  const f=(document.getElementById('q').value||"").trim().toLowerCase();
  let html="", shown=0;
  const flat = CUR_CAT!=="all" || CUR_SORT!=="default" || !!f;  // плоский грид, не по секциям

  if(flat){
    let tools=DATA.tools.filter(t=>(CUR_CAT==="all"||t.category===CUR_CAT) && matches(t,f));
    tools=sortTools(tools);
    shown=tools.length;
    html = shown ? `<section class="cat"><div class="grid">${tools.map((t,i)=>card(t).replace('class="tool"',`class="tool" style="animation-delay:${Math.min(i*22,300)}ms"`)).join("")}</div></section>` : "";
  } else {
    const byCat={};
    DATA.tools.forEach(t=>{(byCat[t.category]=byCat[t.category]||[]).push(t);});
    DATA.categories.forEach(c=>{
      let tools=(byCat[c.key]||[]).filter(t=>matches(t,f));
      if(!tools.length) return;
      shown+=tools.length;
      html+=`<section class="cat" id="cat-${c.key}"><h2>${esc(c.name)} <span class="n">${tools.length}</span></h2>
        <div class="grid">${tools.map((t,i)=>card(t).replace('class="tool"',`class="tool" style="animation-delay:${Math.min(i*18,260)}ms"`)).join("")}</div></section>`;
    });
  }
  document.getElementById('list').innerHTML=html;
  document.getElementById('empty').style.display=shown?'none':'block';
  document.getElementById('count').textContent=`${shown} ${plural(shown,'инструмент','инструмента','инструментов')}`;
}

function buildStats(){
  const tools=DATA.tools||[];
  const totalStars=tools.reduce((s,t)=>s+(Number(t.stars)||0),0);
  const fmtK=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);
  const cats=(DATA.categories||[]).length;
  document.getElementById('stats').innerHTML=
    `<div class="st"><b>${tools.length}</b><span>инструментов</span></div>
     <div class="st"><b>${cats}</b><span>разделов</span></div>
     <div class="st"><b>${fmtK(totalStars)}</b><span>★ суммарно</span></div>`;
}

function buildCats(){
  const byCat={};
  DATA.tools.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+1;});
  const all=DATA.tools.length;
  let html=`<button data-cat="all" class="on">Все <span class="c">${all}</span></button>`;
  DATA.categories.forEach(c=>{
    const n=byCat[c.key]||0; if(!n) return;
    html+=`<button data-cat="${c.key}">${esc(c.name)} <span class="c">${n}</span></button>`;
  });
  const nav=document.getElementById('cats');
  nav.innerHTML=html;
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    CUR_CAT=b.dataset.cat;
    nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    render();
    document.querySelector('.controls').scrollIntoView({behavior:'smooth',block:'start'});
  }));
}

function flashHash(){
  const h=decodeURIComponent(location.hash.replace('#',''));
  if(!h) return;
  // deep-link на конкретный инструмент (#slug) — бот ведёт сюда из постов
  if(CUR_CAT!=="all"||CUR_SORT!=="default"){CUR_CAT="all";CUR_SORT="default";
    document.getElementById('sort').value="default";buildCats();render();}
  const el=document.getElementById(h);
  if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),2600);}
}

fetch('catalog.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  DATA.tools.forEach(t=>{if(!t.slug)t.slug=slugify(t.name);});
  NEW_SET=computeNew(d.tools); NEW_RANK=newRank(d.tools);
  document.getElementById('title').innerHTML = d.title && d.title!=='Каталог'
    ? esc(d.title) : 'Каталог <span class="ac">инструментов</span>';
  document.getElementById('subtitle').textContent = d.subtitle || '';
  if(d.channel){document.getElementById('chan').href=d.channel;}
  buildStats(); buildCats(); render();
  setTimeout(flashHash,90);
}).catch(e=>{ document.getElementById('list').innerHTML=
  '<div class="empty">Не удалось загрузить каталог. Обнови страницу.</div>'; });

document.getElementById('q').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',e=>{CUR_SORT=e.target.value;render();});
window.addEventListener('hashchange',flashHash);
